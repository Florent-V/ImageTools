services:
  backend:
    environment:
      CORS_ORIGINS: ${REMOTE_CORS_ORIGINS:-http://localhost:3010}
    ports:
      - "127.0.0.1:${REMOTE_BACKEND_PORT:-8011}:8000"

  frontend:
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${REMOTE_API_BASE_URL:-}
    ports:
      - "127.0.0.1:${REMOTE_FRONTEND_PORT:-3010}:3000"
