# Dev stack (make dev): http://localhost:FRONTEND_PORT, hot reload.
services:
  api:
    image: imagetools-api:dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # Host network: the OAuth issuer is http://localhost:8080 and the backend
    # must reach it under that exact name (the issuer is compared as a string).
    network_mode: host
    environment:
      APP_ENV: dev
      COOKIE_SECURE: "false"
      # Browsers don't isolate cookies by port: another app on localhost would clash
      SESSION_COOKIE_NAME: imagetools-session
    volumes:
      - ./backend/app:/app/app

  web:
    image: imagetools-web:dev
    build:
      target: build
    # Nuxt dev server; /api and /auth are proxied to the backend (nitro.devProxy)
    command: pnpm run dev --host 0.0.0.0 --port 3000
    environment:
      DEV_BACKEND_URL: http://host.docker.internal:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
