services:
  backend:
    image: imagetools-backend:dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
    ports:
      - "${BACKEND_PORT:-8010}:8000"

  frontend:
    image: imagetools-frontend:dev
    build:
      target: build
    command: pnpm run dev --host 0.0.0.0 --port 3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    environment:
      NUXT_DEV_API_TARGET: http://backend:8000/api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
